syntax = "proto3";

package orders;

option go_package = "github.com/Mizuhar4/order-service/pb";

// ─ Mensajes ─────────────────────────────────────────────

message OrderItem {
  string product_id = 1;
  int32 quantity    = 2;
  float unit_price  = 3;
  float subtotal    = 4;
}

message Order {
  string order_id         = 1;
  string client_id        = 2;
  string restaurant_id    = 3;
  string delivery_id      = 4;
  string status           = 5;
  string delivery_address = 6;
  repeated OrderItem items = 7;
  float total_amount      = 8;
  string created_at       = 9;
}

message CreateOrderRequest {
  string client_id          = 1;
  string restaurant_id      = 2;
  string delivery_address   = 3;
  repeated CreateOrderItemRequest items = 4;
}

message CreateOrderItemRequest {
  string product_id = 1;
  int32 quantity    = 2;
}

message CreateOrderResponse {
  string order_id    = 1;
  string status      = 2;
  float total_amount = 3;
  string created_at  = 4;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

// ─ Servicio ─────────────────────────────────────────────

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
}
